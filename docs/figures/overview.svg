<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="618" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>

  <!-- zone outlines -->
  <rect x="24" y="44" width="236" height="310" rx="10" fill="none" stroke="#B8C2CC" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="276" y="44" width="370" height="310" rx="10" fill="none" stroke="#B8C2CC" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="662" y="44" width="260" height="310" rx="10" fill="none" stroke="#B8C2CC" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="948" y="44" width="228" height="310" rx="10" fill="none" stroke="#B8C2CC" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g font-size="13" fill="#5A6875" letter-spacing="1.2">
    <text x="36" y="34">INPUTS</text>
    <text x="288" y="34">PERCEPTION AND PREDICTION</text>
    <text x="674" y="34">CONTROL</text>
    <text x="960" y="34">ROBOT</text>
  </g>

  <!-- reference path, drawn -->
  <path d="M 52,92 C 52,70 80,70 92,92 C 104,114 132,114 132,92 C 132,70 104,70 92,92 C 80,114 52,114 52,92 Z" fill="none" stroke="#C97A2B" stroke-width="2"/>
  <text x="146" y="88" font-size="17" fill="#15202A">reference</text>
  <text x="146" y="108" font-size="15" fill="#5A6875">figure 8, circle</text>

  <!-- lidar crop -->
  <image href="ov_lidar.png" x="40" y="140" width="96" height="130" preserveAspectRatio="xMidYMid slice"/>
  <rect x="40" y="140" width="96" height="130" rx="6" fill="none" stroke="#8A9AA8" stroke-width="1"/>
  <text x="148" y="196" font-size="17" fill="#15202A">2D lidar</text>
  <text x="148" y="216" font-size="15" fill="#5A6875">/scan, 5 Hz</text>

  <!-- reference arrow to NMPC, above the perception row -->
  <line x1="246" y1="92" x2="672" y2="92" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <text x="460" y="82" font-size="15" fill="#5A6875" text-anchor="middle"><tspan font-family="Georgia, serif" font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="11">ref</tspan> = 0.18 m/s along the path</text>

  <!-- perception and tracker -->
  <line x1="232" y1="186" x2="290" y2="186" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="292" y="150" width="152" height="72" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="1.5"/>
  <text x="368" y="182" font-size="22" fill="#15202A" text-anchor="middle">Perception</text>
  <text x="368" y="205" font-size="15" fill="#5A6875" text-anchor="middle">scan to circles</text>
  <line x1="444" y1="186" x2="474" y2="186" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="476" y="150" width="152" height="72" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="1.5"/>
  <text x="552" y="182" font-size="22" fill="#15202A" text-anchor="middle">Tracker</text>
  <text x="552" y="205" font-size="15" fill="#5A6875" text-anchor="middle">Kalman filter</text>
  <line x1="628" y1="186" x2="672" y2="186" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>

  <!-- prediction sketch: one track moved to each stage, radius grows -->
  <g>
    <circle cx="312" cy="290" r="9" fill="#15202A"/>
    <circle cx="352" cy="276" r="11" fill="none" stroke="#1F5FBF" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="396" cy="261" r="14" fill="none" stroke="#1F5FBF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <circle cx="444" cy="245" r="17" fill="none" stroke="#1F5FBF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <line x1="312" y1="290" x2="340" y2="280" stroke="#15202A" stroke-width="1.5" marker-end="url(#ah)"/>
    <!-- planned robot path passing behind -->
    <path d="M 300,318 C 340,318 372,312 404,300 C 436,288 452,292 476,306" fill="none" stroke="#0D7A6F" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
    <text x="490" y="268" font-size="15" fill="#5A6875">each track moved to</text>
    <text x="490" y="287" font-size="15" fill="#5A6875">every stage, 0 to 3 s;</text>
    <text x="490" y="306" font-size="15" fill="#5A6875">radius grows with</text>
    <text x="490" y="325" font-size="15" fill="#5A6875">velocity uncertainty</text>
  </g>

  <!-- NMPC -->
  <rect x="674" y="64" width="236" height="236" rx="10" fill="#DCF1EE" stroke="#0D7A6F" stroke-width="1.5"/>
  <text x="792" y="104" font-size="26" fill="#15202A" text-anchor="middle">acados NMPC</text>
  <text x="792" y="128" font-size="16" fill="#0D7A6F" text-anchor="middle">10 Hz</text>
  <g font-size="16" fill="#15202A" text-anchor="middle">
    <text x="792" y="168"><tspan font-family="Georgia, serif" font-style="italic">N</tspan> = 30 stages, <tspan font-family="Georgia, serif" font-style="italic">Δt</tspan> = 0.1 s</text>
    <text x="792" y="194">unicycle, RK4, SQP-RTI</text>
    <text x="792" y="220">soft clearance to</text>
    <text x="792" y="240">6 predicted circles</text>
    <text x="792" y="274" fill="#5A6875" font-size="15">0.8 to 0.9 ms median solve</text>
  </g>

  <!-- command to robot -->
  <line x1="910" y1="160" x2="958" y2="160" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <text x="934" y="146" font-size="15" fill="#15202A" text-anchor="middle"><tspan font-family="Georgia, serif" font-style="italic">v</tspan>, <tspan font-family="Georgia, serif" font-style="italic">ω</tspan></text>

  <!-- robot -->
  <rect x="960" y="64" width="204" height="236" rx="10" fill="#F1F4F6" stroke="#8A9AA8" stroke-width="1.5"/>
  <image href="ov_lab_robot.png" x="972" y="76" width="180" height="138" preserveAspectRatio="xMidYMid slice"/>
  <rect x="972" y="76" width="180" height="138" rx="6" fill="none" stroke="#8A9AA8" stroke-width="1"/>
  <text x="1062" y="246" font-size="22" fill="#15202A" text-anchor="middle">TurtleBot3</text>
  <text x="1062" y="272" font-size="15" fill="#5A6875" text-anchor="middle">lab robot or Webots</text>

  <!-- closed loop: scan and odometry back -->
  <path d="M 1062,300 L 1062,340 L 88,340 L 88,274" fill="none" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="792" y1="340" x2="792" y2="304" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="950" y="331" width="88" height="18" fill="#FFFFFF"/>
  <text x="994" y="345" font-size="15" fill="#5A6875" text-anchor="middle">scan, odom</text>

  <!-- results band -->
  <text x="36" y="396" font-size="13" fill="#5A6875" letter-spacing="1.2">RESULTS</text>
  <line x1="110" y1="391" x2="1164" y2="391" stroke="#E1E6EA" stroke-width="1"/>

  <image href="ov_webots.png" x="36" y="412" width="200" height="140" preserveAspectRatio="xMidYMid slice"/>
  <rect x="36" y="412" width="200" height="140" rx="6" fill="none" stroke="#8A9AA8" stroke-width="1"/>
  <text x="36" y="576" font-size="15" fill="#15202A">Webots, person crossing</text>
  <text x="36" y="596" font-size="15" fill="#5A6875">at 0.5 m/s</text>

  <image href="ov_paths.png" x="256" y="412" width="187" height="140" preserveAspectRatio="xMidYMid slice"/>
  <rect x="256" y="412" width="187" height="140" rx="6" fill="none" stroke="#8A9AA8" stroke-width="1"/>
  <text x="256" y="576" font-size="15" fill="#15202A">true paths of the 4</text>
  <text x="256" y="596" font-size="15" fill="#5A6875">controllers, same run</text>

  <image href="ov_circle.png" x="463" y="412" width="140" height="140" preserveAspectRatio="xMidYMid slice"/>
  <rect x="463" y="412" width="140" height="140" rx="6" fill="none" stroke="#8A9AA8" stroke-width="1"/>
  <text x="463" y="576" font-size="15" fill="#15202A">lab, r = 0.5 m circle</text>
  <text x="463" y="596" font-size="15" fill="#5A6875">1.0 and 1.9 cm RMS</text>

  <image href="ov_explore_map.png" x="623" y="412" width="226" height="140" preserveAspectRatio="xMidYMid slice"/>
  <rect x="623" y="412" width="226" height="140" rx="6" fill="none" stroke="#8A9AA8" stroke-width="1"/>
  <text x="623" y="576" font-size="15" fill="#15202A">lab exploration, 5 min 30 s</text>
  <text x="623" y="596" font-size="15" fill="#5A6875">13.2 m x 8.4 m mapped</text>

  <!-- headline number -->
  <rect x="880" y="412" width="284" height="140" rx="10" fill="none" stroke="#B8461F" stroke-width="1.5"/>
  <text x="898" y="470" font-size="42" fill="#B8461F" font-weight="bold">1/7</text>
  <text x="972" y="452" font-size="16" fill="#15202A">NMPC runs with contact,</text>
  <text x="972" y="472" font-size="16" fill="#15202A">person crossing 0.5 m/s</text>
  <line x1="904" y1="496" x2="1140" y2="496" stroke="#E1E6EA" stroke-width="1"/>
  <text x="904" y="524" font-size="16" fill="#5A6875">Nav2 MPPI 3/3, RPP 2/2,</text>
  <text x="904" y="544" font-size="16" fill="#5A6875">NMPC without prediction 2/2</text>
</svg>
