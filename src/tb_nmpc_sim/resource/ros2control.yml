# From webots_ros2_turtlebot; speed cap raised to the Burger's 0.22 m/s (the controllers cap at 0.20).
controller_manager:
  ros__parameters:
    update_rate: 50

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diffdrive_controller:
  ros__parameters:
    left_wheel_names: ["left wheel motor"]
    right_wheel_names: ["right wheel motor"]
    wheel_separation: 0.16
    wheel_radius: 0.033
    # As upstream: the nominal separation gives a poor odometry in Webots.
    wheel_separation_multiplier: 1.112
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true
    publish_rate: 50.0
    linear:
      x:
        max_velocity: 0.22

joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - LDS-01_secondary_motor
      - LDS-01_main_motor
